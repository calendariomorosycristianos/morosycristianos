<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moros y Cristianos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #111111;
            color: white;
            text-align: center;
        }

        .contenedor {
            width: 90%;
            max-width: 800px;
            padding: 40px 20px;
        }

        .titulo {
            font-size: 56px;
            letter-spacing: 6px;
            margin: 0;
            font-weight: 700;
        }

        .linea {
            width: 80px;
            height: 3px;
            background: white;
            margin: 25px auto;
        }

        .subtitulo {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 30px;
        }

        .texto {
            font-size: 18px;
            line-height: 1.7;
            color: #cccccc;
            margin-bottom: 35px;
        }

        .categorias {
            font-size: 15px;
            letter-spacing: 2px;
            color: #aaaaaa;
        }

        .proximamente {
            margin-top: 45px;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            .titulo {
                font-size: 36px;
                letter-spacing: 4px;
            }

            .subtitulo {
                font-size: 20px;
            }

            .texto {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="contenedor">

        <h1 class="titulo">MOROS Y CRISTIANOS</h1>

        <div class="linea"></div>

        <h2 class="subtitulo">
            El calendario de las fiestas de Moros y Cristianos
        </h2>

        <p class="texto">
            Estamos preparando un nuevo espacio para descubrir,
            consultar y disfrutar de las fiestas de Moros y Cristianos
            de toda España.
        </p>

        <div class="categorias">
            FIESTAS · FECHAS · LOCALIDADES · PROGRAMAS
        </div>

        <div class="proximamente">
            Próximamente
        </div>

    </main>

</body>
</html>
